name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to validate (for package naming only)"
        required: true
        default: "v0.5.0"
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout FrustLang (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch JUCE
        shell: pwsh
        run: |
          git clone --depth 1 --branch 8.0.7 https://github.com/juce-framework/JUCE.git "$env:RUNNER_TEMP\JUCE"

      - name: Restore prebuilt LLVM from S3 (no build, ever)
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
        run: |
          # Same real, already-built LLVM (vcpkg's x64-windows triplet) the
          # Creation Suite apps pull from this same S3 path - Frust core's
          # CMakeLists.txt hardcodes a dev-machine path to this exact vcpkg
          # install (see CMakePresets.json's windows-vcpkg preset), so this
          # step downloads and extracts the identical artifact rather than
          # building LLVM from source on the runner, same as CreationEngine's
          # own release pipeline does.
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\vcpkg-cache" | Out-Null
          aws s3 cp s3://creation-suite-build-cache/vcpkg-cache/llvm-vcpkg-x64-windows.tar "$env:RUNNER_TEMP\llvm.tar"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download the prebuilt LLVM archive from S3."
          }
          tar -xf "$env:RUNNER_TEMP\llvm.tar" -C "$env:RUNNER_TEMP\vcpkg-cache"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract the prebuilt LLVM archive."
          }
          Remove-Item "$env:RUNNER_TEMP\llvm.tar" -Force
          if (-not (Test-Path "$env:RUNNER_TEMP\vcpkg-cache\vcpkg_installed\x64-windows")) {
            throw "vcpkg_installed\x64-windows missing after extraction."
          }

      - name: Satisfy LLVM's baked-in DIA SDK path
        shell: pwsh
        run: |
          # Same fixup CreationEngine's pipeline needs - this is the
          # identical vcpkg-built LLVM, whose exported CMake config
          # (LLVMDebugInfoPDB) hardcodes an absolute path to diaguids.lib
          # from the machine that built it.
          $expected = "D:\Program Files\Microsoft Visual Studio\2022\Enterprise\DIA SDK\lib\amd64\diaguids.lib"
          if (Test-Path $expected) {
            Write-Host "Already present at expected path."
          } else {
            $found = Get-ChildItem -Path "C:\Program Files*\Microsoft Visual Studio" -Recurse -Filter "diaguids.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $found) {
              throw "Could not find diaguids.lib anywhere on this runner."
            }
            New-Item -ItemType Directory -Force -Path (Split-Path $expected) | Out-Null
            Copy-Item -Path $found.FullName -Destination $expected -Force
            Write-Host "Copied $($found.FullName) -> $expected"
          }

      - name: Install WinFlexBison (prebuilt binary, no compile)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/lexxmark/winflexbison/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*win_flex_bison*.zip" } | Select-Object -First 1
          if (-not $asset) {
            throw "Could not find a WinFlexBison release zip asset."
          }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\winflexbison.zip"
          New-Item -ItemType Directory -Force -Path "C:\tools\winflexbison" | Out-Null
          Expand-Archive -Path "$env:RUNNER_TEMP\winflexbison.zip" -DestinationPath "C:\tools\winflexbison" -Force
          if (-not (Test-Path "C:\tools\winflexbison\win_bison.exe")) {
            throw "win_bison.exe missing after WinFlexBison extraction."
          }

      - name: Classify release
        id: classify
        shell: pwsh
        run: |
          # Manual runs validate a prospective release without publishing it.
          $tag = "${{ inputs.release_tag || github.ref_name }}"
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)(?:-(?<channel>[0-9A-Za-z.-]+))?$') {
            throw "Tag '$tag' must look like v0.5.0 (optionally v0.5.0-beta.1)."
          }
          $versionText = $Matches.version
          $explicitChannel = $Matches.channel
          $prerelease = "false"
          if ($explicitChannel) {
            $prerelease = "true"
          } else {
            $major = [int]($versionText.Split('.')[0])
            if ($major -eq 0) { $prerelease = "true" }
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$versionText"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "prerelease=$prerelease"

      - name: Configure and build frust_compiler + frate
        shell: pwsh
        run: |
          $llvmPrefix = "$env:RUNNER_TEMP\vcpkg-cache\vcpkg_installed\x64-windows\share\llvm"
          cmake -S "projects/01_language_paradigms/02_functional" -B "build-core" -A x64 `
            -DCMAKE_PREFIX_PATH="$llvmPrefix" `
            -DJUCE_PATH="$env:RUNNER_TEMP\JUCE" `
            -DFLEX_EXECUTABLE="C:\tools\winflexbison\win_flex.exe" `
            -DBISON_EXECUTABLE="C:\tools\winflexbison\win_bison.exe" `
            -DFRUST_WINFLEXBISON_DIR="C:\tools\winflexbison"
          if ($LASTEXITCODE -ne 0) { throw "CMake configure (frust_compiler) failed." }
          cmake --build "build-core" --config Release
          if ($LASTEXITCODE -ne 0) { throw "Build (frust_compiler) failed." }

      - name: Configure and build the IDE
        shell: pwsh
        run: |
          $llvmPrefix = "$env:RUNNER_TEMP\vcpkg-cache\vcpkg_installed\x64-windows\share\llvm"
          cmake -S "projects/02_juce_language_host" -B "build-ide" -A x64 `
            -DCMAKE_PREFIX_PATH="$llvmPrefix" `
            -DFLEX_EXECUTABLE="C:\tools\winflexbison\win_flex.exe" `
            -DBISON_EXECUTABLE="C:\tools\winflexbison\win_bison.exe" `
            -DFRUST_WINFLEXBISON_DIR="C:\tools\winflexbison" `
            -DJUCE_PATH="$env:RUNNER_TEMP\JUCE"
          if ($LASTEXITCODE -ne 0) { throw "CMake configure (IDE) failed." }
          cmake --build "build-ide" --config Release
          if ($LASTEXITCODE -ne 0) { throw "Build (IDE) failed." }

      - name: Build and run the tutorial example (gates the whole release)
        shell: pwsh
        run: |
          # The GitHub wiki tutorial is a real promise to readers, not just
          # prose - examples/tutorial-first-program/ is that promise kept
          # as an actual buildable pod. If it stops compiling, stops
          # linking, or its output ever drifts from what the wiki claims,
          # that's the tutorial silently lying - fail here, nothing ships.
          $bin = "bin\Release"
          $env:FRUST_LLVM_ROOT = "$env:RUNNER_TEMP\vcpkg-cache\vcpkg_installed\x64-windows"

          Push-Location "projects\06_frust_library\core"
          & "$PWD\..\..\..\$bin\frate.exe" package
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "frate package (core) failed." }
          & "$PWD\..\..\..\$bin\frate.exe" install
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "frate install (core) failed." }
          Pop-Location

          $frate = (Resolve-Path "$bin\frate.exe").Path

          $tutorials = @(
            @{ Path = "examples\tutorial-first-program"; Expected = @("Entrance Hall", "A cold stone hall. Torches flicker on the walls.") },
            @{ Path = "examples\tutorial-dungeon\02-room-voice"; Expected = @("The Map Room", "Someone labeled the danger zone 'probably fine.'") },
            @{ Path = "examples\tutorial-dungeon\03-locked-exit"; Expected = @("A brass cellar door", "The door is locked. It is enjoying this.") },
            @{ Path = "examples\tutorial-dungeon\04-turn-loop"; Expected = @("The lantern flickers on turn:", "3") }
          )

          foreach ($tutorial in $tutorials) {
            Push-Location $tutorial.Path
            $output = & $frate run 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
            Pop-Location

            Write-Host $output

            if ($exitCode -ne 0) {
              throw "Tutorial example '$($tutorial.Path)' failed to build/run (exit $exitCode). The wiki tutorial is broken - fix it before this can ship."
            }
            foreach ($expected in $tutorial.Expected) {
              if ($output -notmatch [regex]::Escape($expected)) {
                throw "Tutorial example '$($tutorial.Path)' ran but did not print expected text '$expected'. Got:`n$output"
              }
            }
          }
          Write-Host "All tutorial examples verified - output matches the wiki."

      - name: Stage release package
        shell: pwsh
        run: |
          $stage = "artifacts\stage\frust-${{ steps.classify.outputs.version }}"
          New-Item -ItemType Directory -Force -Path "$stage\bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage\lib" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage\plugins" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage\stdlib" | Out-Null

          Copy-Item "bin\Release\frust_compiler.exe" "$stage\bin\"
          Copy-Item "bin\Release\frate.exe" "$stage\bin\"
          Copy-Item "bin\Release\frust_ide.exe" "$stage\bin\"
          Copy-Item "lib\Release\frust_runtime.lib" "$stage\lib\"
          Copy-Item "lib\Release\frust_lang.lib" "$stage\lib\"
          Copy-Item "lib\Release\frust_plugin_host.lib" "$stage\lib\"
          Copy-Item "lib\Release\frate_lib.lib" "$stage\lib\"
          Copy-Item "projects\02_juce_language_host\plugins\*" "$stage\plugins\" -Recurse
          Copy-Item "projects\06_frust_library\core" "$stage\stdlib\core" -Recurse
          Copy-Item "projects\06_frust_library\plugin" "$stage\stdlib\plugin" -Recurse
          Copy-Item "projects\06_frust_library\meta" "$stage\stdlib\meta" -Recurse
          Copy-Item "README.md" "$stage\"
          Copy-Item "LICENSE" "$stage\"

      - name: Smoke test staged release package
        shell: pwsh
        run: |
          $stage = Resolve-Path "artifacts\stage\frust-${{ steps.classify.outputs.version }}"
          $probe = Join-Path $env:RUNNER_TEMP "frust-release-smoke"
          Copy-Item $stage $probe -Recurse -Force
          $env:FRATE_CACHE_DIR = Join-Path $env:RUNNER_TEMP "frate-release-smoke-cache"
          $env:FRUST_LLVM_ROOT = "$env:RUNNER_TEMP\vcpkg-cache\vcpkg_installed\x64-windows"
          $env:PATH = "$probe\bin;$env:PATH"

          Push-Location $probe
          & "$probe\bin\frate.exe" new release_smoke
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "Packaged frate could not scaffold a pod." }
          Push-Location "release_smoke"
          & "$probe\bin\frate.exe" run
          if ($LASTEXITCODE -ne 0) { Pop-Location; Pop-Location; throw "A pod built by the staged release package failed to run." }
          Pop-Location

          Push-Location "release_smoke"
          & "$probe\bin\frate.exe" add core 1.0.1
          if ($LASTEXITCODE -ne 0) { Pop-Location; Pop-Location; throw "Packaged frate could not add the bundled core pod." }
          Copy-Item "$env:GITHUB_WORKSPACE\examples\tutorial-first-program\src\main.fr" "src\main.fr" -Force
          $output = & "$probe\bin\frate.exe" run 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $output -notmatch [regex]::Escape("Entrance Hall")) {
            Pop-Location
            Pop-Location
            throw "The staged release package could not build and run the tutorial's core pod example. Output:`n$output"
          }
          if ((Get-Content "build\link.rsp" -Raw) -match "frust_plugin_host\.lib|LLVM[A-Za-z0-9_]*\.lib") {
            Pop-Location
            Pop-Location
            throw "A basic core application pulled optional plugin or LLVM libraries into its link step."
          }
          Pop-Location
          Pop-Location

          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          $zipName = "artifacts\frust-${{ steps.classify.outputs.tag }}-windows-x64.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zipName -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frust-release
          path: artifacts/*

      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: Frust ${{ steps.classify.outputs.version }}
          prerelease: ${{ steps.classify.outputs.prerelease }}
          files: artifacts/*
          body: |
            Windows x64 build of the Frust compiler, `frate`, and the JUCE-based IDE.

            Requires the [Microsoft Visual C++ Redistributable](https://aka.ms/vs/17/release/vc_redist.x64.exe) on the target machine.

            See the [wiki](https://github.com/wwestlake/FrustLang/wiki) for a full language tutorial.
